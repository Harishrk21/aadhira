# Netlify build config for aruratherapy.in (Vite / React SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_SITE_URL = "https://aruratherapy.in"

# ── Redirects ──────────────────────────────────────────────────────────────────

# Redirect www → apex
[[redirects]]
  from   = "https://www.aruratherapy.in/*"
  to     = "https://aruratherapy.in/:splat"
  status = 301
  force  = true

# SPA fallback — valid app routes serve index.html (unknown paths handled by edge 404)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Custom 404 page — Netlify serves with HTTP 404 for missing static files
# Unknown app routes return this via netlify/edge-functions/not-found.ts

[[edge_functions]]
  function = "not-found"
  path     = "/*"

# ── Cache headers ──────────────────────────────────────────────────────────────

# HTML entry points — always revalidate so browsers pick up new hashed chunks
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex, follow"

# Hashed assets are immutable — cache for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files (sitemap, robots, images) — 1 day
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type  = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type  = "text/plain; charset=utf-8"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Security headers (all pages) ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(self)"
    X-XSS-Protection          = "1; mode=block"
